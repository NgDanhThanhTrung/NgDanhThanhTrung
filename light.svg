<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="260" viewBox="0 0 1180 260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Profile banner">
  <rect width="1180" height="260" fill="#F8FAFC"/>
  <defs>
    <linearGradient id="accent_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <text x="40" y="70" font-size="14" letter-spacing="2" fill="#0891B2">SYSTEM.INFO</text>
  <line x1="40" y1="82" x2="1140" y2="82" stroke="url(#accent_light)" stroke-width="1.5" opacity="0.7"/>

  <text x="40" y="140" font-size="40" font-weight="700" fill="#0F172A">YOUR NAME HERE<tspan fill="#0891B2">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  <text x="40" y="175" font-size="16" fill="#475569">Role / Title goes here · Replace this banner in light.svg</text>

  <text x="40" y="220" font-size="12" fill="#94A3B8">github.com/NgDanhThanhTrung</text>
</svg>
